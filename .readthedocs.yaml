# Read the Docs build configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# Installs fitpo with its docs extra and builds the Sphinx site; any Sphinx
# warning fails the build, as it does locally and in CI.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
